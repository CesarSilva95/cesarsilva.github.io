<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O Seu Grande Dia</title>
<meta name="description" content="Questionário pré-casamento · Cesar Silva Filmes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>

/* Layout: uma coluna estreita e centrada, como uma carta; uma etapa por vez, com a marca no topo */
:root {
  --bg: #16130f;
  --bg-2: #1e1a15;
  --line: #3a3228;
  --ink: #f1ebe0;
  --muted: #a99d8a;
  --gold: #c9a96e;
  --gold-soft: #2a2319;
  --display: "Cormorant Garamond", "Garamond", "Times New Roman", serif;
  --body: "Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--body);
  font-weight: 300;
  font-size: 17px;
  line-height: 1.6;
  padding-inline: 20px;
  padding-block: 0 64px;
  background:
    radial-gradient(1200px 500px at 0% 0%, #241e17 0%, transparent 60%),
    var(--bg);
  min-height: 100%;
}
.wrap { max-width: 640px; margin: 0 auto; }

/* Topo */
.brand {
  display: flex; flex-direction: column; align-items: center;
  padding-block: 36px 8px;
}
.brand img { width: 92px; height: auto; display: block; }

.eyebrow {
  font-family: var(--body);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--gold);
}

/* Progresso */
.progress { display: grid; gap: 10px; margin-block: 28px 8px; }
.progress[hidden] { display: none !important; }
.progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.progress-count { font-size: 13px; color: var(--muted); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.bar { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .5s ease; }

/* Etapas */
.step { display: grid; gap: 28px; padding-block: 24px 0; }
.step h1, .step h2 {
  font-family: var(--display);
  font-weight: 400;
  line-height: 1.05;
  margin: 0;
  text-wrap: balance;
}
.step h1 { font-size: clamp(44px, 9vw, 68px); }
.step h2 { font-size: clamp(36px, 7vw, 50px); }
.step h1 em, .step h2 em { color: var(--gold); font-style: italic; }
.lede { color: var(--muted); margin: 0; max-width: 58ch; }
.head { display: grid; gap: 14px; }

.intro { text-align: center; justify-items: center; padding-block: 12px 0; }
.intro .lede { font-family: var(--display); font-size: 22px; line-height: 1.45; color: #d9cfbf; }
.sign { font-size: 13px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.rule { width: 56px; height: 1px; background: var(--gold); opacity: .6; border: 0; margin: 0; }

/* Campos */
.fields { display: grid; gap: 26px; }
.field { display: grid; gap: 8px; min-width: 0; }
.field label, .field .q {
  font-size: 15px; font-weight: 400; color: var(--ink); line-height: 1.45;
}
.field .hint { font-size: 13px; color: var(--muted); margin-top: -4px; }
.req { color: var(--gold); margin-left: 2px; }
input[type="text"], input[type="tel"], input[type="date"], textarea {
  width: 100%;
  font: inherit;
  font-weight: 300;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  padding: 8px 0 10px;
  transition: border-color .2s ease;
}
textarea { resize: vertical; min-height: 64px; line-height: 1.55; }
input::placeholder, textarea::placeholder { color: #6f6556; }
input:focus, textarea:focus { outline: none; border-bottom-color: var(--gold); }
input[type="date"] { color-scheme: dark; }
.invalid input, .invalid textarea { border-bottom-color: #d07a5f; }
.err { font-size: 13px; color: #e09a80; }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
@media (max-width: 520px) { .pair { grid-template-columns: 1fr; } }

/* Escolhas */
.choices { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  font: inherit; font-size: 14px; font-weight: 400; letter-spacing: .04em;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 18px;
  cursor: pointer;
  transition: border-color .2s, background .2s, color .2s;
}
.chip:hover { border-color: var(--gold); }
.chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #1a150f; }
.note {
  font-size: 14px; color: var(--muted);
  border-left: 1px solid var(--gold);
  padding: 2px 0 2px 14px;
}

/* Botões */
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; flex-wrap: wrap; }
.btn {
  font: inherit; font-size: 13px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
  border-radius: 999px; padding: 15px 28px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .15s ease, background .2s, border-color .2s;
}
.btn:active { transform: translateY(1px); }
.btn-gold { background: var(--gold); color: #1a150f; border: 1px solid var(--gold); }
.btn-gold:hover { background: #d6b87f; }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-ghost:hover { border-color: var(--gold); }
.btn-text { background: none; border: 0; color: var(--muted); padding: 15px 4px; }
.btn-text:hover { color: var(--ink); }
.btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* Revisão */
.review { display: grid; gap: 22px; }
.review section { display: grid; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); }
.review h3 { font-family: var(--display); font-weight: 500; font-size: 24px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.review h3 button { font: inherit; font-family: var(--body); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); background: none; border: 0; cursor: pointer; padding: 4px 0; }
.review dl { margin: 0; display: grid; gap: 10px; }
.review dt { font-size: 13px; color: var(--muted); }
.review dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.review dd.empty { color: #6f6556; font-style: italic; }

.send { display: grid; gap: 14px; justify-items: start; }
.send-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.small { font-size: 13px; color: var(--muted); }

.done { text-align: center; justify-items: center; }

footer { margin-top: 56px; text-align: center; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #6f6556; }

.step { animation: rise .45s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .step { animation: none; } .bar span { transition: none; } }
</style>
</head>

    gate: { id: "temMaking", q: "O making of faz parte do seu pacote?", options: ["Sim", "Não", "Não sei"] },
    fields: [

      ]}
    ]

const flat = s => s.fields.flatMap(f => f.pair ? f.pair : [f]);

/* Estado */
let data = {};
let current = -1; // -1 = abertura; STEPS.length = revisão; STEPS.length+1 = enviado
try { const s = JSON.parse(localStorage.getItem(STORE) || "null"); if (s) { data = s.data || {}; } } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify({ data })); } catch (e) {} }

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function fieldHTML(f) {
  const v = data[f.id] ?? "";
  const req = f.req ? '<span class="req" aria-hidden="true">*</span>' : "";
  const hint = f.hint ? `<div class="hint" id="h-${f.id}">${esc(f.hint)}</div>` : "";
  const desc = f.hint ? ` aria-describedby="h-${f.id}"` : "";
  if (f.type === "choice") {
    return `<div class="field" data-id="${f.id}"><span class="q">${esc(f.q)}${req}</span>
      <div class="choices" role="group" aria-label="${esc(f.q)}">${f.options.map(o =>
        `<button type="button" class="chip" data-choice="${f.id}" data-value="${esc(o)}" aria-pressed="${v === o}">${esc(o)}</button>`).join("")}</div></div>`;
  }
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : "";
  const input = f.type === "area"
    ? `<textarea id="${f.id}" rows="2"${ph}${desc}>${esc(v)}</textarea>`
    : `<input id="${f.id}" type="${f.type}" value="${esc(v)}"${ph}${desc}${f.type === "tel" ? ' inputmode="tel" autocomplete="tel"' : ""}>`;
  return `<div class="field" data-id="${f.id}"><label for="${f.id}">${esc(f.q)}${req}</label>${hint}${input}</div>`;
}

function renderProgress() {
  const p = document.getElementById("progress");
  if (current < 0 || current > STEPS.length) { p.hidden = true; return; }
  p.hidden = false;
  const total = STEPS.length + 1;
  const n = current + 1;
  document.getElementById("progress-label").textContent = current === STEPS.length ? "Revisão" : STEPS[current].label;
  document.getElementById("progress-count").textContent = `${n} de ${total}`;
  document.getElementById("progress-bar").style.width = `${(n / total) * 100}%`;
}

function render() {
  renderProgress();
  if (current === -1) return renderIntro();
  if (current === STEPS.length) return renderReview();
  if (current === STEPS.length + 1) return renderDone();
  const s = STEPS[current];
  let gate = "";
  let hideFields = false;
  if (s.gate) {
    const g = data[s.gate.id] ?? "";
    hideFields = g === "Não";
    gate = `<div class="field" data-id="${s.gate.id}"><span class="q">${esc(s.gate.q)}</span>
      <div class="choices" role="group" aria-label="${esc(s.gate.q)}">${s.gate.options.map(o =>
        `<button type="button" class="chip" data-choice="${s.gate.id}" data-value="${o}" aria-pressed="${g === o}">${o}</button>`).join("")}</div></div>`;
  }
  const fields = s.fields.map(f => f.pair
    ? `<div class="pair">${f.pair.map(fieldHTML).join("")}</div>`
    : fieldHTML(f)).join("");
  app.innerHTML = `<form class="step" id="step-form" novalidate>
    <div class="head"><h2>${s.title}</h2><p class="lede">${esc(s.lede)}</p></div>
    ${gate}
    ${hideFields ? `<p class="note">Sem problema. Pode seguir para a próxima etapa.</p>` : `<div class="fields">${fields}</div>`}
    <div class="nav">
      <button type="button" class="btn btn-text" id="back">Voltar</button>
      <button type="submit" class="btn btn-gold">${current === STEPS.length - 1 ? "Revisar respostas" : "Continuar"}</button>
    </div>
  </form>`;
  bindStep(s);
}

function bindStep(s) {
  const form = document.getElementById("step-form");
  form.addEventListener("input", e => {
    if (e.target.id) { data[e.target.id] = e.target.value; save(); e.target.closest(".field")?.classList.remove("invalid"); e.target.closest(".field")?.querySelector(".err")?.remove(); }
  });
  form.querySelectorAll("[data-choice]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.choice;
    data[id] = data[id] === b.dataset.value ? "" : b.dataset.value;
    save();
    if (s.gate && id === s.gate.id) { render(); return; }
    form.querySelectorAll(`[data-choice="${id}"]`).forEach(x => x.setAttribute("aria-pressed", x.dataset.value === data[id]));
  }));
  document.getElementById("back").addEventListener("click", () => go(current - 1));
  form.addEventListener("submit", e => {
    e.preventDefault();
    const missing = flat(s).filter(f => f.req && !(data[f.id] || "").trim());
    form.querySelectorAll(".err").forEach(x => x.remove());
    if (missing.length) {
      missing.forEach(f => {
        const el = form.querySelector(`.field[data-id="${f.id}"]`);
        el.classList.add("invalid");
        el.insertAdjacentHTML("beforeend", `<span class="err">Preencha este campo para continuar.</span>`);
      });
      document.getElementById(missing[0].id)?.focus();
      return;
    }
    go(current + 1);
  });
}

function go(n) {
  current = Math.max(-1, Math.min(n, STEPS.length + 1));
  render();
  window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  const h = app.querySelector("h1, h2");
  if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
}

function renderIntro() {
  const started = Object.values(data).some(v => v);
  app.innerHTML = `<section class="step intro">
    <h1>O seu grande <em>dia</em></h1>
    <hr class="rule">
    <p class="lede">Cada detalhe do seu casamento merece ser lembrado. Responda com calma, e eu cuido de registrar tudo com naturalidade.</p>
    <p class="small">Leva poucos minutos. As respostas ficam salvas neste aparelho enquanto você preenche. Itens marcados com <span class="req">*</span> são obrigatórios.</p>
    <div class="nav" style="justify-content:center">
      <button type="button" class="btn btn-gold" id="start">${started ? "Continuar de onde parei" : "Começar"}</button>
    </div>
    <span class="sign">Com carinho, Cesar Silva</span>
  </section>`;
  document.getElementById("start").addEventListener("click", () => {
    const firstOpen = started ? STEPS.findIndex(s => flat(s).some(f => f.req && !(data[f.id] || "").trim())) : 0;
    go(firstOpen === -1 ? STEPS.length : firstOpen);
  });
}

function fmtDate(v) {
  if (!v) return "";
  const [y, m, d] = v.split("-");
  return d && m && y ? `${d}/${m}/${y}` : v;
}
function display(f) {
  const v = (data[f.id] || "").trim();
  return f.type === "date" ? fmtDate(v) : v;
}
function stepIsSkipped(s) { return s.gate && data[s.gate.id] === "Não"; }

function buildMessage() {
  const lines = ["*Questionário do grande dia · Cesar Silva Filmes*", ""];
  STEPS.forEach((s, i) => {
    lines.push(`*${i + 1}. ${s.label}*`);
    if (s.gate) lines.push(`${s.gate.q} ${data[s.gate.id] || "-"}`);
    if (!stepIsSkipped(s)) {
      flat(s).forEach(f => lines.push(`${f.q}: ${display(f) || "-"}`));
    }
    lines.push("");
  });
  return lines.join("\n").trim();
}

/* Monta o envio no formato que o Google Forms espera */
function buildFormBody() {
  const v = id => (data[id] || "").trim();
  const p = new URLSearchParams();
  const put = (id, val) => { if (val) p.append("entry." + ENTRY[id], val); };
  const semMaking = data.temMaking === "Não";

  put("noivos", v("noivos"));
  const [y, m, d] = v("data").split("-");
  if (y && m && d) {
    p.append(`entry.${ENTRY.data}_year`, y);
    p.append(`entry.${ENTRY.data}_month`, String(+m));
    p.append(`entry.${ENTRY.data}_day`, String(+d));
  }
  ["cer", "rec", "cerimonialista", "fotografo"].forEach(id => put(id, v(id)));

  // A preparação não tem pergunta própria no Forms: vai junto com "onde cada um vai se arrumar"
  const arrumar = [
    data.temMaking ? `Making of no pacote: ${data.temMaking}` : "",
    v("prep") ? `Preparação: ${v("prep")}` : "",
    semMaking ? "" : v("ondeArrumar")
  ].filter(Boolean).join("\n");
  put("ondeArrumar", arrumar);
  if (!semMaking) ["quemJunto", "itens", "reservado"].forEach(id => put(id, v(id)));

  ["naoFicarFora", "especial", "homenagem", "restricao"].forEach(id => put(id, v(id)));

  if (v("tipo") === "Outra") {
    p.append(`entry.${ENTRY.tipo}`, "__other_option__");
    p.append(`entry.${ENTRY.tipo}.other_option_response`, "Outra");
  } else put("tipo", v("tipo"));

  ["duracao", "entrada", "momentos", "restricoesLocal", "programados", "surpresas", "discurso",
   "musica", "fazQuestao", "contatoNome", "contatoTel"].forEach(id => put(id, v(id)));

  p.append("pageHistory", Array.from({ length: FORM_PAGES }, (_, i) => i).join(","));
  return p;
}

const WA_ICON =`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.4-.2Z"/></svg>`;

function renderReview() {
  const sections = STEPS.map((s, i) => {
    const gate = s.gate ? `<dt>${esc(s.gate.q)}</dt><dd class="${data[s.gate.id] ? "" : "empty"}">${esc(data[s.gate.id] || "Não respondido")}</dd>` : "";
    const rows = stepIsSkipped(s) ? "" : flat(s).map(f => {
      const v = display(f);
      return `<dt>${esc(f.q)}</dt><dd class="${v ? "" : "empty"}">${esc(v || "Não respondido")}</dd>`;
    }).join("");
    return `<section><h3>${esc(s.label)} <button type="button" data-edit="${i}">Editar</button></h3><dl>${gate}${rows}</dl></section>`;
  }).join("");
  const url = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(buildMessage())}`;
  app.innerHTML = `<section class="step">
    <div class="head"><h2>Tudo <em>certo?</em></h2>
      <p class="lede">Confira as respostas. Se quiser mudar algo, toque em editar na parte correspondente.</p></div>
    <div class="review">${sections}</div>
    <div class="send">
      <div class="send-actions">
        <button type="button" class="btn btn-gold" id="submit">Enviar respostas</button>
      </div>
      <span class="small" id="send-status" role="status"></span>
      <div class="send" id="fallback" hidden>
        <div class="send-actions">
          <a class="btn btn-ghost" href="${url}" target="_blank" rel="noopener">${WA_ICON}Enviar pelo WhatsApp</a>
          <button type="button" class="btn btn-ghost" id="copy">Copiar respostas</button>
        </div>
        <span class="small" id="copy-status">Ou copie as respostas e cole numa conversa com (14) 98108-7903.</span>
      </div>
    </div>
    <div class="nav"><button type="button" class="btn btn-text" id="back">Voltar</button></div>
  </section>`;
  app.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => go(+b.dataset.edit)));
  document.getElementById("back").addEventListener("click", () => go(STEPS.length - 1));
  document.getElementById("submit").addEventListener("click", async e => {
    const btn = e.currentTarget, status = document.getElementById("send-status");
    btn.disabled = true; btn.textContent = "Enviando…"; status.textContent = "";
    try {
      await fetch(FORM_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: buildFormBody().toString()
      });
      try { localStorage.setItem(STORE + "-enviado", new Date().toISOString()); } catch (err) {}
      go(STEPS.length + 1);
    } catch (err) {
      btn.disabled = false; btn.textContent = "Tentar de novo";
      status.textContent = "Não foi possível enviar agora. Verifique a internet e tente de novo, ou mande pelo WhatsApp.";
      document.getElementById("fallback").hidden = false;
    }
  });
  document.getElementById("copy").addEventListener("click", async () => {
    const status = document.getElementById("copy-status");
    const text = buildMessage();
    try { await navigator.clipboard.writeText(text); status.textContent = "Respostas copiadas. Agora é só colar numa conversa com (14) 98108-7903."; }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.rows = 8; ta.readOnly = true; ta.style.width = "100%";
      status.replaceWith(ta); ta.focus(); ta.select();
    }
  });
}

function renderDone() {
  app.innerHTML = `<section class="step intro done">
    <span class="eyebrow">Recebido</span>
    <h1>Obrigado, <em>de coração</em></h1>
    <hr class="rule">
    <p class="lede">Vou usar cada resposta para me preparar com todo o cuidado para o dia de vocês. Em breve entro em contato.</p>
    <span class="sign">Cesar Silva</span>
  </section>`;
}

render();
</script>
